name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
  
  test:
    runs-on: ubuntu-latest
    needs: lint
    env: 
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest
      
  upload:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          echo "commit: ${{ github.sha }}" > build-info.txt
          echo "branch: ${{ github.ref_name }}" >> build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt


          # https://github.com/luckepucke6/ci-lucas-ml25/actions/runs/37472417599/job/112299477608

      
      

